<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SyncSafe</title>
  <meta name="theme-color" content="#18202a">
  <script src="/js/theme.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- ===== Boot / unsupported ===== -->
  <div id="boot-view" class="auth"><div class="auth-card"><div class="brand-lg"><img src="/icon.svg" alt="" width="40" height="40"> SyncSafe</div><p class="muted" id="boot-message">…</p></div></div>

  <!-- ===== Unlock (data on this device is encrypted with the password) ===== -->
  <div id="lock-view" class="auth" hidden>
    <div class="auth-tools"><select class="lang-select" data-i18n-aria="common.language"></select>
      <button type="button" class="ghost theme-toggle" data-theme-toggle><span class="theme-label">Light mode</span></button></div>
    <div class="auth-card">
      <div class="brand-lg"><img src="/icon.svg" alt="" width="40" height="40"> SyncSafe</div>
      <h2 id="lock-title"></h2>
      <p class="muted small" data-i18n="lock.why"></p>
      <form id="lock-form" class="stack">
        <label><span data-i18n="auth.password"></span><input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit" class="primary" data-i18n="lock.unlock"></button>
        <button type="button" class="link" id="lock-switch" data-i18n="lock.switch"></button>
      </form>
    </div>
  </div>

  <!-- ===== Login / register ===== -->
  <div id="login-view" class="auth" hidden>
    <div class="auth-tools"><select class="lang-select" data-i18n-aria="common.language"></select>
      <button type="button" class="ghost theme-toggle" data-theme-toggle><span class="theme-label">Light mode</span></button></div>
    <div class="auth-card">
      <div class="brand-lg"><img src="/icon.svg" alt="" width="40" height="40"> SyncSafe</div>
      <p class="muted" data-i18n="auth.tagline"></p>
      <div id="auth-message" class="auth-message" hidden></div>

      <div id="server-box" class="stack server-box" hidden>
        <label><span data-i18n="server.address"></span>
          <input id="server-url" type="url" inputmode="url" placeholder="192.168.1.5:3000" autocapitalize="off" autocorrect="off" spellcheck="false">
        </label>
        <div class="muted small" data-i18n="server.help"></div>
        <button type="button" id="test-server" class="secondary" data-i18n="server.test"></button>
      </div>

      <div class="seg" role="tablist">
        <button type="button" class="seg-btn active" data-auth="login" data-i18n="auth.login"></button>
        <button type="button" class="seg-btn" data-auth="create" data-i18n="auth.create_team"></button>
        <button type="button" class="seg-btn" data-auth="join" data-i18n="auth.join_team"></button>
      </div>

      <form id="login-form" class="stack auth-form" data-mode="login">
        <label><span data-i18n="auth.email"></span><input name="email" type="email" required autocomplete="username"></label>
        <label><span data-i18n="auth.password"></span><input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit" class="primary" data-i18n="auth.login"></button>
      </form>
      <form id="register-form" class="stack auth-form" hidden>
        <label><span data-i18n="auth.name"></span><input name="name" required autocomplete="name"></label>
        <label><span data-i18n="auth.email"></span><input name="email" type="email" required autocomplete="email"></label>
        <label><span data-i18n="auth.password_new"></span><input name="password" type="password" minlength="6" required autocomplete="new-password"></label>
        <label class="only-create"><span data-i18n="auth.team_name"></span><input name="team_name" maxlength="60"></label>
        <label class="only-join"><span data-i18n="auth.invite_code"></span><input name="invite_code" placeholder="DEMO-2026" autocapitalize="characters"></label>
        <button type="submit" class="primary" id="register-submit" data-i18n="auth.create_team"></button>
      </form>

      <div class="samples">
        <div class="muted small" data-i18n="auth.samples"></div>
        <div class="sample-row">
          <button type="button" class="chip-btn" data-email="admin@syncsafe.test" data-pass="Admin@123">Admin</button>
          <button type="button" class="chip-btn" data-email="meera@syncsafe.test" data-pass="Test@123">Meera</button>
          <button type="button" class="chip-btn" data-email="asha@syncsafe.test" data-pass="Test@123">Asha</button>
          <button type="button" class="chip-btn" data-email="ravi@syncsafe.test" data-pass="Test@123">Ravi</button>
          <button type="button" class="chip-btn" data-email="guest@syncsafe.test" data-pass="Test@123">Guest</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Main app ===== -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand"><img src="/icon.svg" alt="" width="26" height="26"> <span>SyncSafe</span></div>
      <div id="status-pill" class="status-pill" title=""><span class="dot"></span><span id="status-text"></span><span id="live-dot" class="live-dot" hidden data-i18n-title="status.live">●</span></div>
      <div class="topbar-actions">
        <span id="user-name" class="user-name"></span>
        <label class="switch" data-i18n-title="top.simulate_help"><input type="checkbox" id="sim-offline"><span data-i18n="top.simulate"></span></label>
        <button id="sync-now" class="secondary" data-i18n="top.sync_now"></button>
        <button id="bell" class="ghost bell" data-i18n-aria="top.notifications"><span aria-hidden="true">🔔</span><span id="bell-count" class="badge" hidden>0</span></button>
        <select class="lang-select" data-i18n-aria="common.language"></select>
        <button type="button" class="ghost theme-toggle" data-theme-toggle><span class="theme-label">Light mode</span></button>
        <button id="logout" class="ghost" data-i18n="top.logout"></button>
      </div>
      <div id="notif-panel" class="notif-panel" hidden></div>
    </header>

    <div id="offline-banner" class="banner" hidden data-i18n="banner.offline"></div>
    <div id="readonly-banner" class="banner info" hidden data-i18n="banner.viewer"></div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="records" data-i18n="tab.records"></button>
      <button class="tab" data-tab="map" data-i18n="tab.map"></button>
      <button class="tab" data-tab="conflicts"><span data-i18n="tab.conflicts"></span> <span id="conflict-badge" class="badge" hidden>0</span></button>
      <button class="tab" data-tab="reports" data-i18n="tab.reports"></button>
      <button class="tab" data-tab="activity"><span data-i18n="tab.activity"></span> <span id="pending-badge" class="badge muted-badge" hidden>0</span></button>
      <button class="tab" data-tab="admin" id="admin-tab" hidden data-i18n="tab.admin"></button>
    </nav>

    <main>
      <section id="tab-records" class="panel"></section>
      <section id="tab-map" class="panel" hidden></section>
      <section id="tab-conflicts" class="panel" hidden></section>
      <section id="tab-reports" class="panel" hidden></section>
      <section id="tab-activity" class="panel" hidden></section>
      <section id="tab-admin" class="panel" hidden></section>
    </main>

    <dialog id="editor"></dialog>
    <dialog id="history-dialog"></dialog>
    <dialog id="photo-dialog" class="photo-dialog"></dialog>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <script src="/vendor/leaflet.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
