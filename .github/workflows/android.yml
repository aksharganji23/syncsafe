# Builds the SyncSafe Android app and packages the website, on GitHub's servers.
#
#   Push to main        -> release "latest"  (replaced on every push)
#   Push a tag v2.0.1   -> release "v2.0.1"  (kept)
#   Actions tab         -> "Run workflow" builds by hand
#
# Each release holds:
#   SyncSafe.apk                 debug APK, installs over the previous one (fixed debug key)
#   SyncSafe-release.apk         signed release APK (only when the signing secrets exist, docs/GITHUB.md)
#   syncsafe-website.zip         the server + website, ready for `npm install` and `npm start`
#   syncsafe-android-app.zip     the Android Studio project
name: Android APK and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Website tests (a release is only made when they pass)
        working-directory: website
        run: |
          npm ci
          npm test

      - name: Install the app's packages and copy the website screens into it
        working-directory: android-app
        run: |
          npm ci
          node scripts/copy-web.js
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Load the release signing key (skipped when the secrets are not set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SYNCSAFE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_KEY=1" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: building the debug APK only."
          fi

      - name: Build the APK(s)
        working-directory: android-app/android
        env:
          SYNCSAFE_VERSION_CODE: ${{ github.run_number }}
          SYNCSAFE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SYNCSAFE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SYNCSAFE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/out"
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/SyncSafe.apk"
          if [ "$HAS_RELEASE_KEY" = "1" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/SyncSafe-release.apk"
          fi

      - name: Zip the website and the Android project
        run: |
          git archive --format=zip --prefix=syncsafe-website/ -o out/syncsafe-website.zip HEAD:website
          rm -rf /tmp/app && mkdir -p /tmp/app/syncsafe-android-app
          git archive HEAD:android-app | tar -x -C /tmp/app/syncsafe-android-app
          cp -r android-app/public /tmp/app/syncsafe-android-app/public
          (cd /tmp/app && zip -qr "$GITHUB_WORKSPACE/out/syncsafe-android-app.zip" syncsafe-android-app)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: syncsafe-build
          path: out/*

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"; TITLE="SyncSafe ${GITHUB_REF_NAME}"
          else
            TAG="latest"; TITLE="SyncSafe (latest build)"
            gh release delete latest --yes --cleanup-tag || true
          fi
          NOTES="Built from commit ${GITHUB_SHA::7} (run #${GITHUB_RUN_NUMBER}).

          - **SyncSafe.apk**: open it on your Android phone to install (allow \"install unknown apps\" once).
          - **SyncSafe-release.apk**: signed release build, present when the signing secrets are set.
          - **syncsafe-website.zip**: unzip, then \`npm install\` and \`npm start\` on the laptop.
          - **syncsafe-android-app.zip**: the Android Studio project.

          This repository is private, so sign in to GitHub on the phone's browser before downloading."
          gh release create "$TAG" out/* --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"

  # Installs the APK on an Android emulator, opens it, checks it does not crash and
  # saves a screenshot. Informational: a flaky emulator never blocks the release.
  emulator-check:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: syncsafe-build

      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and screenshot on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r SyncSafe.apk
            adb logcat -c
            adb shell pm grant edu.ucmo.syncsafe android.permission.POST_NOTIFICATIONS || true
            adb shell monkey -p edu.ucmo.syncsafe -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > screenshot.png
            adb logcat -d > logcat.txt
            adb shell pidof edu.ucmo.syncsafe || (echo "App is not running: it crashed on start"; grep -E "FATAL|AndroidRuntime" logcat.txt | head -40; exit 1)
            if grep -q "FATAL EXCEPTION" logcat.txt; then echo "Crash found in logcat"; grep -A20 "FATAL EXCEPTION" logcat.txt | head -60; exit 1; fi
            grep -i "Capacitor/Console" logcat.txt | head -40 || true

      - name: Upload screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: |
            screenshot.png
            logcat.txt
